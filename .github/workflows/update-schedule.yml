name: Update ARTIS schedule

on:
  schedule:
    # Every hour at :30, around the clock.
    #
    # Running overnight is the point, not just extra safety: countdown.js
    # treats a schedule.json dated to a previous day as stale and falls back
    # to the "shows have finished for today" screen. With the first run of the
    # day at 08:30 local, the display showed that message all night and every
    # morning until the scraper caught up.
    #
    # An hourly job also needs no local-time mapping, which retires the two
    # DST-split rules this replaced - they were knowingly an hour out for the
    # few days between each real DST switch and the month boundary.
    #
    # :30 rather than :00 keeps the scrape clear of the top of the hour, when
    # every display reloads itself.
    - cron: "30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scrape.mjs

      - name: Commit schedule.json if it changed
        run: |
          git config user.name "artis-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update schedule.json [automated]"
          git push
